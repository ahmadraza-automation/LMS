{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 border-0">
            <h3 class="fw-bold mb-3 text-center">Create New Course</h3>
            <hr class="mb-4">

            <form method="POST" novalidate>
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label fw-semibold">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <div class="form-text">{{ field.help_text }}</div>
                        {% endif %}
                        {% for error in field.errors %}
                            <div class="text-danger small mt-1">{{ error }}</div>
                        {% endfor %}
                    </div>
                {% endfor %}

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mt-2">
                    <i class="bi bi-check-circle me-1"></i> Save Course
                </button>
                <a href="{% url 'courses:course_list' %}" class="btn btn-outline-secondary w-100 py-2 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
