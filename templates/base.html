<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elite Squad - LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4" href="{% url 'courses:course_list' %}">
                <span class="bg-primary text-white p-2 rounded-3 me-2 d-inline-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                    <i class="bi bi-mortarboard-fill fs-5"></i>
                </span>
                <span class="text-white ms-1">AHMAD <span class="text-primary">SQUAD</span></span>
            </a>
            
            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    {% if user.is_staff %}
                        <a href="{% url 'admin:index' %}" class="btn btn-warning btn-sm me-2 px-3 rounded-pill fw-bold" target="_blank">
                            <i class="bi bi-gear-fill me-1"></i> Admin Panel
                        </a>
                    {% endif %}
                    <a href="{% url 'courses:dashboard' %}" class="btn btn-outline-light btn-sm me-2 px-3 rounded-pill">
                        <i class="bi bi-speedometer2 me-1"></i> Dashboard
                    </a>
                    <a href="{% url 'courses:create_course' %}" class="btn btn-primary btn-sm me-3 px-3 rounded-pill">
                        <i class="bi bi-plus-lg me-1"></i> Create Course
                    </a>
                    <span class="navbar-text me-3 text-white fw-semibold">
                        <i class="bi bi-person-circle text-info me-1"></i> {{ user.username }}
                    </span>
                    <a href="{% url 'admin:logout' %}" class="btn btn-outline-danger btn-sm rounded-pill">Logout</a>
                {% else %}
                    <a href="{% url 'admin:login' %}?next=/" class="btn btn-primary btn-sm px-4 rounded-pill">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
